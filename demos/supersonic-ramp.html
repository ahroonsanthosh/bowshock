<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07090c" />
    <meta
      name="description"
      content="Oblique shocks and Prandtl-Meyer expansion fans over a ramp, solved live on your GPU and compared with exact theory."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M27 4 Q6 8 5 16 Q6 24 27 28%27 fill=%27none%27 stroke=%27%23ff5a6e%27 stroke-width=%273%27 stroke-linecap=%27round%27/%3E%3Cpath d=%27M11 16 L27 11.5 L27 20.5 Z%27 fill=%27%23e6e8eb%27/%3E%3C/svg%3E"
    />
    <title>Supersonic ramp · bowshock</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body class="app">
    <main class="stage">
      <h1 class="visually-hidden">Supersonic ramp</h1>
      <div class="viewport">
        <canvas
          id="flow"
          role="img"
          tabindex="0"
          aria-label="The computed flow field over the ramp"
        ></canvas>
        <canvas id="overlay" aria-hidden="true"></canvas>
      </div>
    </main>
    <aside class="panel panel--left" id="panel-case" data-title="Ramp">
      <div class="panel__body">
        <div class="field">
          <label class="field__label" for="mach"
            >Mach number <output id="mach-value" class="field__value" for="mach"></output
          ></label>
          <input id="mach" type="range" min="1.3" max="4" step="0.1" value="2.5" />
        </div>
        <div class="field">
          <label class="field__label" for="angle"
            >Ramp angle <output id="angle-value" class="field__value" for="angle"></output
          ></label>
          <input id="angle" type="range" min="-20" max="25" step="1" value="10" />
        </div>
        <div class="field">
          <label class="field__label" for="resolution">Grid</label>
          <select id="resolution">
            <option value="120x60">120 × 60</option>
            <option value="240x120">240 × 120</option>
          </select>
        </div>
        <div class="field panel__row">
          <button id="pause" class="button" type="button" aria-keyshortcuts="Space">Pause</button>
          <button id="restart" class="button" type="button" aria-keyshortcuts="R">Run again</button>
        </div>
        <p class="panel__note">
          Steady supersonic flow over a ramp. Turn the wall into the flow for an oblique shock, or
          away from it for a Prandtl-Meyer expansion fan.
        </p>
      </div>
    </aside>
    <aside
      class="panel panel--right"
      id="panel-exact"
      data-title="Against exact theory"
      data-tab="Exact"
    >
      <div class="panel__body">
        <dl class="figure">
          <dt>Ramp pressure, computed</dt>
          <dd class="figure__main" id="computed">…</dd>
          <dt>Exact</dt>
          <dd id="exact">…</dd>
          <dt>Difference</dt>
          <dd id="difference">…</dd>
        </dl>
        <p><span id="run-badge" class="badge">Starting</span></p>
        <div class="panel__section">
          <p class="panel__note" id="comparison"></p>
          <p class="panel__note" id="engine-note"></p>
        </div>
      </div>
    </aside>
    <script type="module" src="/src/app/ramp.ts"></script>
  </body>
</html>
