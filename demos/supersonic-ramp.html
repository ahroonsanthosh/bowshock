<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M4 28 Q16 2 28 28%27 fill=%27none%27 stroke=%27%23d1495b%27 stroke-width=%274%27/%3E%3C/svg%3E"
    />
    <title>Supersonic ramp</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f5;
        --fg: #1b1b1b;
        --muted: #5c5c5c;
        --canvas: #e9e9e6;
        --accent: #d1495b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111316;
          --fg: #e8e8e6;
          --muted: #a0a0a0;
          --canvas: #1a1d22;
          --accent: #ff7a8a;
        }
      }
      body {
        margin: 0;
        padding: 1.5rem 1rem;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 64rem;
        margin: 0 auto;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.5rem;
        align-items: end;
        margin-bottom: 0.75rem;
      }
      .field {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      label {
        font-size: 0.8rem;
        color: var(--muted);
      }
      output {
        font-variant-numeric: tabular-nums;
      }
      input[type='range'] {
        width: min(14rem, 80vw);
        accent-color: var(--accent);
      }
      #flow {
        width: 100%;
        display: block;
        border-radius: 6px;
        background: var(--canvas);
      }
      #legend {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 0.25rem 0.6rem;
        align-items: center;
        margin-top: 0.6rem;
        font-variant-numeric: tabular-nums;
        font-size: 0.85rem;
        color: var(--muted);
      }
      #legend-bar {
        height: 0.6rem;
        border-radius: 3px;
      }
      #legend-caption {
        grid-column: 1 / -1;
        margin: 0;
      }
      #legend[hidden],
      #legend [hidden] {
        display: none;
      }
      #status,
      #comparison,
      #engine-note {
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        margin: 0.4rem 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Supersonic ramp</h1>
      <p>
        Steady supersonic flow over a ramp. Turn the wall into the flow for an oblique shock, or
        away from it for a Prandtl-Meyer expansion fan; the computed ramp pressure is compared with
        the exact solution as the run converges.
        <a href="../index.html">Back to bowshock</a>
      </p>
      <div class="controls">
        <div class="field">
          <label for="mach">Mach number <output id="mach-value"></output></label>
          <input id="mach" type="range" min="1.3" max="4" step="0.1" value="2.5" />
        </div>
        <div class="field">
          <label for="angle">Ramp angle <output id="angle-value"></output></label>
          <input id="angle" type="range" min="-20" max="25" step="1" value="10" />
        </div>
        <div class="field">
          <label for="field">Show</label>
          <select id="field">
            <option value="schlieren">Schlieren</option>
            <option value="mach">Mach number</option>
            <option value="pressure">Pressure</option>
            <option value="density">Density</option>
          </select>
        </div>
        <div class="field">
          <label for="resolution">Grid</label>
          <select id="resolution">
            <option value="120x60">120 x 60</option>
            <option value="240x120">240 x 120</option>
          </select>
        </div>
      </div>
      <canvas id="flow"></canvas>
      <div id="legend" hidden>
        <span id="legend-min"></span>
        <div id="legend-bar"></div>
        <span id="legend-max"></span>
        <p id="legend-caption"></p>
      </div>
      <p id="status"></p>
      <p id="comparison"></p>
      <p id="engine-note"></p>
    </main>
    <script type="module" src="/src/app/ramp.ts"></script>
  </body>
</html>
