<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="The supersonic flow around the Basic Finner in 3D, solved on your GPU with the bow shock fitted, drawn as it converges."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M27 4 Q6 8 5 16 Q6 24 27 28%27 fill=%27none%27 stroke=%27%23ff5a6e%27 stroke-width=%273%27 stroke-linecap=%27round%27/%3E%3Cpath d=%27M11 16 L27 11.5 L27 20.5 Z%27 fill=%27%23e6e8eb%27/%3E%3C/svg%3E"
    />
    <title>Flow in 3D · bowshock</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #flow3d {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }
      #flow3d-status {
        position: fixed;
        right: 12px;
        top: 10px;
        margin: 0;
        color: #c8ccd4;
        font:
          12px 'JetBrains Mono',
          ui-monospace,
          monospace;
      }
    </style>
  </head>
  <body>
    <h1 class="visually-hidden">The flow around the Basic Finner at Mach 2, in 3D</h1>
    <canvas
      id="flow3d"
      tabindex="0"
      role="img"
      aria-label="The flow around the Basic Finner in 3D: press H for the keys"
    ></canvas>
    <p id="flow3d-status" role="status" aria-live="polite">Starting</p>
    <script type="module" src="/src/render3d/demo.ts"></script>
  </body>
</html>
