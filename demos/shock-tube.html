<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07090c" />
    <meta
      name="description"
      content="The bowshock 1D solver, on the CPU or the GPU, against the exact solution of Toro's five Riemann problems."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M27 4 Q6 8 5 16 Q6 24 27 28%27 fill=%27none%27 stroke=%27%23ff5a6e%27 stroke-width=%273%27 stroke-linecap=%27round%27/%3E%3Cpath d=%27M11 16 L27 11.5 L27 20.5 Z%27 fill=%27%23e6e8eb%27/%3E%3C/svg%3E"
    />
    <title>Shock tube · bowshock</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body class="app">
    <main class="stage">
      <h1 class="visually-hidden">Shock tube</h1>
      <div class="viewport">
        <canvas
          id="plot"
          role="img"
          tabindex="0"
          aria-label="Density, velocity and pressure along the tube: bowshock against the exact solution"
        ></canvas>
      </div>
    </main>
    <aside class="panel panel--left" id="panel-problem" data-title="Problem">
      <div class="panel__body">
        <div class="field">
          <label class="field__label" for="problem">Riemann problem</label>
          <select id="problem"></select>
        </div>
        <div class="field">
          <label class="field__label" for="engine">Engine</label>
          <select id="engine">
            <option value="cpu">CPU (64-bit)</option>
            <option value="gpu">GPU (WebGPU, 32-bit)</option>
          </select>
        </div>
        <div class="field">
          <label class="field__label" for="flux">Flux</label>
          <select id="flux">
            <option value="hllc">HLLC</option>
            <option value="rusanov">Rusanov</option>
            <option value="godunov">Exact Godunov</option>
          </select>
        </div>
        <div class="field">
          <label class="field__label" for="limiter">Limiter</label>
          <select id="limiter">
            <option value="vanLeer">van Leer</option>
            <option value="vanAlbada">van Albada</option>
            <option value="minmod">minmod</option>
            <option value="monotonizedCentral">MC</option>
            <option value="firstOrder">none (first order)</option>
          </select>
        </div>
        <div class="field">
          <label class="field__label" for="cells">Cells</label>
          <select id="cells">
            <option>100</option>
            <option selected>200</option>
            <option>400</option>
            <option>800</option>
          </select>
        </div>
        <div class="field panel__row">
          <button id="run" class="button button--primary" type="button" aria-keyshortcuts="Space">
            Run
          </button>
          <button id="again" class="button" type="button" aria-keyshortcuts="R">Run again</button>
        </div>
        <p class="panel__note">
          The bowshock 1D solver (dots), on the CPU or the GPU, against the exact solution (line)
          for Toro's five Riemann test problems.
        </p>
      </div>
    </aside>
    <aside
      class="panel panel--right"
      id="panel-exact"
      data-title="Against the exact solution"
      data-tab="Exact"
    >
      <div class="panel__body">
        <dl class="figure">
          <dt>L1 density error</dt>
          <dd class="figure__main" id="l1">…</dd>
          <dt>Time</dt>
          <dd id="time">…</dd>
          <dt>Steps</dt>
          <dd id="steps">…</dd>
        </dl>
        <p class="panel__note">
          The L1 norm of the density error against the exact solution, at the cells' centres, over
          the tube's length of 1.
        </p>
        <p class="panel__note" id="status" role="status"></p>
      </div>
    </aside>
    <script type="module" src="/src/app/shock-tube.ts"></script>
  </body>
</html>
